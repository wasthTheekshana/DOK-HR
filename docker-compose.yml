services:

  postgres:
    image: postgres:16-alpine
    container_name: postgres-hr
    expose:
      - "5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./server/src/db/schema_postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    networks:
      - dokhr-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  dok-hr:
    build: ./server
    container_name: dok-hr
    expose:
      - "5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=postgres        # fix: service name not container name
    networks:
      - dokhr-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  client:
    build: ./client
    container_name: dok-hr-client
    expose:
      - "80"
    networks:
      - dokhr-net
      - shared-nginx            # add: main Nginx reaches client here
    depends_on:
      - dok-hr
    restart: always

networks:
  dokhr-net:
    name: dokhr-net
  shared-nginx:
    name: shared-nginx
    external: false

volumes:
  pg_data: