version: '3.8'

services:
  oracle-xe:
    image: container-registry.oracle.com/database/express:latest
    container_name: oracle-xe
    ports:
      - "1521:1521"
      - "8080:8080"
    environment:
      - ORACLE_PWD=password123
    volumes:
      - oracle_data:/opt/oracle/oradata

volumes:
  oracle_data:
