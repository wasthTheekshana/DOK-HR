version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    expose:
      - "5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./server/src/db/schema_postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  dok-hr:
    build: ./server
    expose:
      - "5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  client:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - dok-hr
    restart: always

volumes:
  pg_data:
